<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Navy Blue Ashoka Chakra with 24 Spokes -->
  <defs>
    <radialGradient id="chakraShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#14213D" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#14213D" stroke-width="4.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#14213D" stroke-width="1.8" />
  <circle cx="100" cy="100" r="22" fill="#14213D" />
  <circle cx="100" cy="100" r="10" fill="#FFF9F0" />
  
  <!-- 24 Spokes -->
  <g stroke="#14213D" stroke-width="2.2" stroke-linecap="round">
    <!-- Spoke group with 15-degree rotations (360/24 = 15) -->
