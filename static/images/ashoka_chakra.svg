    <path d="M100,78 L100,12 M100,78 L97,35 L100,12 L103,35 Z" fill="#14213D" transform="rotate(210 100 100)" />
    <path d="M100,78 L100,12 M100,78 L97,35 L100,12 L103,35 Z" fill="#14213D" transform="rotate(225 100 100)" />
